name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Build the app
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  release:
    needs: build
    runs-on: xcode-27
    env:
      OUT_NAME: YT-SwiftLP
      SPARKLE_VERSION: 2.6.4  
    
    steps: 
      - uses: actions/checkout@v4

      - name: Get version from TAG
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Download the built zip
        uses: actions/download-artifact@v4
        with:
          name: app-zip
          path: .

      - name: Sign the update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          curl -L -o sparkle.tar.xz \
            https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz
          mkdir sparkle && tar -xf sparkle.tar.xz -C sparkle
          SIG=$(echo "$SPARKLE_PRIVATE_KEY" | ./sparkle/bin/sign_update --ed-key-file - "$OUT_NAME.zip")
          echo "SIG=$SIG" >> $GITHUB_ENV
 
      - name: Create release notes from CHANGELOG.md
        run: |
          # Extract the matching version section as Markdown
          awk -v ver="v$VERSION" '
            /^##[ \t]/ {
              if (found) exit
              if ($2 == ver) {
                found = 1
                next
              }
            }
            found {
              print
            }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::No '## v$VERSION' section found in CHANGELOG.md"
            echo "No notes for this version." > notes.md
          fi

          # Convert Markdown to HTML for Sparkle
          awk '
            /^\* / || /^- / {
              if (!list) {
                print "<ul>"
                list = 1
              }
              sub(/^(\*|-)[ ]+/, "")
              print "<li>" $0 "</li>"
              next
            }
            {
              if (list) {
                print "</ul>"
                list = 0
              }
              if ($0 != "") print "<p>" $0 "</p>"
            }
            END {
              if (list) print "</ul>"
            }
          ' notes.md > notes.html
 
      - name: Create appcast.xml
        run: |
          cat > appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>$OUT_NAME</title>
              <item>
                <title>Version $VERSION</title>
                <description><![CDATA[$(cat notes.html)]]></description>
                <sparkle:version>${{ github.run_number }}</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>26.0</sparkle:minimumSystemVersion>
                <enclosure
                  url="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$OUT_NAME.zip"
                  type="application/octet-stream"
                  $SIG />
              </item>
            </channel>
          </rss>
          EOF
 
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "$OUT_NAME.zip" appcast.xml \
            --title "$OUT_NAME $VERSION" \
            --notes-file notes.md